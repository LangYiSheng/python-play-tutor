<!doctype html>
<html lang="zh-CN">
<head>

  <title>小镇练习册 · Pythontopia</title>
  <style id="theme">
    /* Portable subset of frontend/src/features/gameDesign.css. The frame receives this same sheet. */
    :root {
      color-scheme: light;
      --forest: #284b43; --deep: #203b32; --paper: #fbf5e9; --surface: #fffaf0;
      --ink: #513b28; --muted: #72614d; --line: #d7c7a9; --gold: #e6be76; --wash: #e8edde;
      --mono: "JetBrains Mono", Consolas, monospace;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--ink); font-size: 100%; line-height: 1.55;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, select, summary { font: inherit; cursor: pointer; }
    button, select {
      min-height: 36px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--surface); color: var(--forest); font-weight: 600; padding: 4px 12px;
    }
    button:hover:not(:disabled), select:hover { background: var(--wash); }
    :is(button, select, summary):focus-visible { outline: 2px solid var(--forest); outline-offset: -3px; }
    button:disabled { cursor: default; opacity: .55; }
    button.primary { border-color: var(--forest); background: var(--forest); color: #fff9e9; }
    button.primary:hover:not(:disabled) { background: var(--deep); }
    button.primary:focus-visible { outline-color: var(--gold); }
    code { font-family: var(--mono); }
    @media (pointer:coarse), (max-width:560px) { button, select, summary { min-height: 44px; } }
    [hidden] { display: none !important; }
  </style>
  <style>
    body {
      min-height: 100vh; padding: clamp(18px,5vh,56px) max(14px,env(safe-area-inset-right)) 36px;
      background-color: #233e35;
      background-image: radial-gradient(ellipse at 15% 5%, #51695285, transparent 62%),
        linear-gradient(90deg,#c3cb9b08 1px,transparent 1px),linear-gradient(#c3cb9b08 1px,transparent 1px);
      background-size: auto, 32px 32px, 32px 32px;
    }
    .shell { width: min(1100px,100%); margin-inline: auto; }
    .topbar, .brand, .panel-head, .action-row, .button-content, .nav-title, .progress-label, summary { display: flex; align-items: center; }
    .topbar { justify-content: space-between; gap: 12px; color: #fff2d6; margin-bottom: 16px; }
    .brand { gap: 12px; }
    .brand-mark { width: 42px; height: 42px; display: grid; place-items: center; color: var(--gold); border: 1px solid #b4b59166; border-radius: 9px; background: #223e35; }
    .brand-mark .icon { width: 24px; height: 24px; }
    .brand small { display: block; font: 600 .66rem/1.2 var(--mono); letter-spacing: .18em; color: #decca6; }
    .brand h1 { margin: 2px 0 0; font: 700 1.38rem/1.3 "Noto Serif SC","Songti SC",SimSun,serif; }
    .local-note { color: #e0e3d2; font-size: .8rem; }
    .layout { display: grid; grid-template-columns: minmax(0,1fr) minmax(218px,26%); gap: 10px; align-items: start; }
    .card { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
    .panel-head { min-height: 36px; padding: 5px 12px; gap: 8px; background: #f1ebdc; border-bottom: 1px solid var(--line); font-size: .875rem; color: var(--forest); }
    .panel-head h2 { margin: 0; font-size: inherit; }
    .page-index { margin-left: auto; color: var(--muted); font: .78rem var(--mono); }
    .icon { width: 17px; height: 17px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
    .question { padding: clamp(16px,2.2vw,28px); }
    .kind { display: inline-block; padding: 2px 8px; border-radius: 5px; background: var(--wash); color: var(--forest); font-size: .77rem; font-weight: 650; }
    h3 { margin: 8px 0 5px; font: 700 clamp(1.4rem,2.6vw,2rem)/1.4 "Noto Serif SC","Songti SC",SimSun,serif; color: var(--deep); }
    #prompt { margin: 0 0 18px; font-size: .95rem; line-height: 1.75; }
    #stage iframe { width: 100%; display: block; border: 0; height: 320px; background: var(--paper); }
    .action-row { gap: 10px; align-items: stretch; flex-wrap: wrap; padding-top: 15px; margin-top: 16px; border-top: 1px solid var(--line); }
    .button-content { justify-content: center; gap: 7px; }
    .action-row button { font-size: .875rem; }
    #feedback { margin-top: 12px; padding: 10px 13px; background: #e7eddf; color: #294735; border-left: 3px solid #55795b; font-size: .9rem; }
    #feedback[data-status="incorrect"], #feedback[data-status="error"] { background: #f8eada; color: #74432a; border-color: #ae713c; }
    #feedback strong { display: block; }
    .directory { margin: 0; padding: 8px; list-style: none; }
    .directory button { display: flex; width: 100%; text-align: left; align-items: center; gap: 10px; border-color: transparent; background: transparent; padding: 10px; }
    .directory button[aria-current="true"] { background: var(--wash); border-color: #bdccb6; }
    .directory button:focus-visible { outline-offset: -3px; }
    .nav-icon { display: grid; place-items: center; color: var(--forest); }
    .nav-icon .icon { width: 20px; height: 20px; }
    .directory small { display: block; margin-top: 2px; color: var(--muted); font-size: .76rem; font-weight: 400; }
    .nav-title { gap: 4px; font-size: .92rem; }
    .nav-title .icon { width: 14px; height: 14px; }
    .progress-box, .hints { border-top: 1px solid var(--line); padding: 12px 16px; }
    .progress-label { justify-content: space-between; gap: 6px; font-size: .8rem; color: var(--muted); }
    progress { display: block; width: 100%; height: 5px; accent-color: var(--forest); margin-top: 8px; border: 0; border-radius: 4px; overflow: hidden; background: #e4ddcb; }
    progress::-webkit-progress-bar { background: #e4ddcb; } progress::-webkit-progress-value { background: var(--forest); }
    summary { gap: 7px; font-size: .875rem; font-weight: 650; color: var(--forest); list-style:none; }
    summary::-webkit-details-marker {display:none;} summary .caret { margin-left: auto; } details[open] .caret { transform: rotate(180deg); }
    .hints p { margin: 8px 0 0; color: var(--muted); font-size: .875rem; }
    @media(max-width:720px) {
      .layout { grid-template-columns: minmax(0,1fr); }
      .topbar { margin-bottom: 10px; }
      .directory { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 4px; }
    }
    @media(max-width:380px) { .directory button { gap: 5px; padding: 8px 4px; } .local-note { max-width: 7em; text-align: right; } }
  </style>
</head>

  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-book-open"/></svg></div>
        <div><small lang="en">PYTHONTOPIA</small><h1>小镇练习册</h1></div>

    <div class="layout">
      <article class="card" aria-labelledby="title">
        <header class="panel-head"><svg class="icon" aria-hidden="true"><use href="#i-square-pen"/></svg><h2>题目</h2><span class="page-index" id="page-index"></span></header>

  <template id="range-content">
    <style>
      .scene { margin: 0; background: #192d30; border-radius: 8px; overflow: hidden; color: #f8e7c5; border: 1px solid #263e40; }
      .scene canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
      .indices { display: grid; grid-template-columns: repeat(8,1fr); background: #243838; padding: 4px 0 5px; }
      .indices span { text-align: center; color: #c2cdc3; font: 600 .81rem/1.45 var(--mono); }
      .indices span.on { color: #ffe2a0; text-decoration: underline; text-underline-offset: 3px; }
      .scene figcaption { padding: 7px 12px; font-size: .81rem; color: #e6eadc; border-top: 1px solid #e3e7c330; }
      .range-editor { margin-top: 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 14px; }
      .code-line { display: flex; align-items: center; flex-wrap:wrap; gap: 0 3px; color: var(--deep); font: 600 clamp(.82rem,2.8vw,1rem)/1.8 var(--mono); }
      .args { display: inline-flex; flex-wrap: nowrap; align-items: center; gap: 2px; }

    </style>
    <figure class="scene">
      <canvas id="town" width="384" height="112" aria-hidden="true"></canvas>
      <div class="indices" id="indices" aria-hidden="true"></div>
      <figcaption id="lit" aria-live="polite"></figcaption>
    </figure>
    <div class="range-editor">
      <div class="code-line">
        <span><b class="keyword">for</b> i <b class="keyword">in</b> range(</span><span class="args"><select id="start" aria-label="起点 start"></select>, <select id="stop" aria-label="终点 stop"></select>, <select id="step" aria-label="步长 step"></select></span><span>):</span>
      </div>
      <code class="statement">light(i)</code>
      <p class="arg-note">依次调整起点、终点和步长，查看街道上亮起的路灯。</p>
    </div>

  <script type="text/plain" id="range-script">
    function drawTown(canvas, litIndices) {
      const width = 384, height = 112;
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      ctx.imageSmoothingEnabled = false;
      const lit = new Set(litIndices);
      function box(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x, y, w, h);
      }
      // Short horizontal runs keep curves and diagonal edges on the pixel grid.
      function oval(x, y, rx, ry, color) {
        for (let row = -ry; row <= ry; row++) {
          const span = Math.floor(rx * Math.sqrt(1 - (row / (ry + 0.3)) ** 2));
          box(x - span, y + row, span * 2 + 1, 1, color);
        }
      }
      function ridge(points, color) {
        for (let i = 1; i < points.length; i++) {
          const [x0, y0] = points[i - 1], [x1, y1] = points[i];
          for (let x = x0; x < x1; x += 2) {
            const y = Math.round((y0 + (y1 - y0) * (x - x0) / (x1 - x0)) / 2) * 2;
            box(x, y, 2, height - y, color);
          }
        }
      }
      box(0, 0, width, height, '#172b46');
      [['#1c3451', 15], ['#223e59', 27], ['#29495f', 37], ['#315267', 49]].forEach(([c, y]) => box(0, y, width, height - y, c));
      let seed = 703;
      function random() {
        seed = (seed * 48271) % 2147483647;
        return seed / 2147483647;
      }
      for (let i = 0; i < 62; i++) {
        const x = Math.floor(random() * width), y = Math.floor(random() * 45) + 1;
        box(x, y, i % 8 === 0 ? 2 : 1, 1, i % 4 === 0 ? '#b0c6c9' : '#627f95');
      }
      [[53, 12], [171, 23], [346, 12]].forEach(([x, y]) => {
        box(x - 1, y, 3, 1, '#829da9'); box(x, y - 1, 1, 3, '#829da9');
        box(x, y, 1, 1, '#e3d8aa');
      });
      oval(286, 20, 13, 13, '#2e4859');
      oval(286, 20, 10, 10, '#9fae9e');
      oval(286, 19, 9, 9, '#ddcf9d');
      box(282, 14, 4, 2, '#bcbf9d'); box(288, 22, 4, 2, '#c4c29c');
      box(290, 20, 2, 2, '#c4c29c'); box(281, 23, 2, 1, '#bcbf9d');
      [[3, 29, 21], [89, 20, 28], [203, 11, 18], [315, 31, 24]].forEach(([x, y, w]) => {
        box(x, y, w, 2, '#2d4760'); box(x + 7, y - 2, w - 13, 2, '#2c455d');
        box(x + w - 5, y + 2, 12, 1, '#314a60');
      });
      ridge([[0, 40], [15, 43], [41, 27], [54, 36], [71, 31], [104, 49], [137, 29], [146, 32], [159, 26], [186, 45], [205, 39], [218, 44], [247, 25], [268, 39], [286, 35], [310, 47], [344, 30], [363, 39], [384, 32]], '#34546a');
      ridge([[0, 52], [21, 45], [39, 51], [76, 38], [96, 49], [114, 43], [135, 51], [167, 37], [192, 53], [221, 43], [238, 49], [256, 42], [280, 51], [306, 37], [334, 49], [360, 42], [384, 48]], '#28495b');
      function pine(x, base, size, color) {
        for (let row = 0; row < size; row += 2) {
          const half = Math.floor(row * .23 + (row % 8 < 4 ? 0 : 1));
          box(x - half, base - size + row, half * 2 + 1, 2, color);
        }
        box(x - 1, base - 3, 3, 6, color);
      }
      for (let x = 0; x < width + 5; x += 5) {
        pine(x, 68, 10 + Math.floor(random() * 17), '#213f4d');
      }
      box(0, 67, width, 15, '#203a43');
      function windowAt(x, y, warm) {
        box(x - 1, y - 1, 6, 7, '#273a43');
        box(x, y, 4, 4, warm ? '#b29d71' : '#577283');
        box(x, y, 1, 4, warm ? '#cfad77' : '#6b8190');
        box(x + 2, y, 1, 4, '#4d5551'); box(x - 1, y + 4, 6, 1, '#607078');
      }
      function cottage(x, base, w, h, roofHeight, warm) {
        const top = base - h;
        box(x, top, w, h, '#48575d');
        box(x + 2, top + 1, w - 6, h - 2, '#596366');
        box(x + w - 8, top + 1, 7, h - 1, '#414f58');
        box(x + w - 9, top - roofHeight, 4, roofHeight - 1, '#48505a');
        box(x + w - 10, top - roofHeight - 1, 6, 2, '#586373');
        for (let r = 0; r < roofHeight; r++) {
          const inset = roofHeight - 1 - r;
          box(x - 2 + inset, top - roofHeight + r, w + 4 - inset * 2, 1, r % 4 === 0 ? '#536575' : '#3e5161');
        }
        box(x - 2, top, w + 4, 2, '#2b404c');
        const doorX = x + Math.floor(w / 2);
        box(doorX, base - 8, 4, 8, '#33444a');
        box(doorX + 3, base - 5, 1, 1, '#938d6d');
        windowAt(x + 4, base - 9, warm);
        if (w > 22) windowAt(x + w - 8, base - 9, warm);
        box(x - 1, base, w + 2, 2, '#293d42');
      }
      [[-7, 72, 24, 11, 6, false], [41, 70, 31, 12, 8, true],
       [79, 72, 20, 9, 6, false], [128, 70, 28, 13, 8, false],
       [165, 73, 25, 10, 5, true], [212, 72, 30, 10, 7, false],
       [275, 72, 27, 12, 7, true], [340, 71, 32, 11, 9, false]].forEach(args => cottage(...args));
      // A slate-roofed bell tower gives the little town a recognizable skyline.
      box(246, 48, 11, 24, '#59666c'); box(253, 48, 4, 24, '#414f59');
      for (let row = 0; row < 9; row++) {
        const edge = Math.floor(row * .8);
        box(251 - edge, 39 + row, edge * 2 + 1, 1, '#506372');
      }
      box(251, 36, 1, 4, '#819090'); box(244, 48, 15, 2, '#324652');
      windowAt(250, 53, true);
      [[10, 77, 23], [29, 77, 16], [110, 78, 26], [119, 77, 17], [193, 77, 19],
       [200, 77, 26], [263, 76, 16], [314, 78, 25], [324, 77, 19], [382, 76, 26]].forEach(([x, y, s]) => pine(x, y, s, '#1d3840'));
      box(0, 76, width, 8, '#263e44');
      for (let x = 1; x < width; x += 12) {

    const draft = practice.initialDraft || {start: 0, stop: 8, step: 2};
    const bounds = [[0, 7], [0, 8], [1, 4]];
    controls.forEach((select, index) => {
      const [min, max] = bounds[index];
      for (let i = min; i <= max; i++) select.add(new Option(String(i), String(i)));
      select.value = String(draft[select.id]);
      select.addEventListener('change', () => {

    const labels = Array.from({length: 8}, (_, index) => {

    function litIndices() {
      const [start, stop, step] = controls.map(select => Number(select.value));
      const lit = [];

    function renderLamps() {

    renderLamps();

      } else {
        const missing = goal.filter(lamp => !lit.includes(lamp));
        const extra = lit.filter(lamp => !goal.includes(lamp));
        const differences = [];
        if (missing.length) differences.push('还缺 ' + missing.join('、') + ' 号');
        if (extra.length) differences.push('多亮了 ' + extra.join('、') + ' 号');
        practice.incorrect(differences.join('，') + '。调整参数后可以再提交。');
      }
    });

  <script type="text/plain" id="stack-script">
  const items = {

      name: '药草', colors: { d:'#355636', g:'#5a9157', l:'#91b669', h:'#c3d986', b:'#8a6943', s:'#bf9660' },
      pixels: ['................','.........dd.....','........dggd....','.......dghld....','...ddd.dlgd.....','..dglgd.dg...dd.','..dghlgdgg.ddgd.','...dgggdg.dgld..','....ddggddgld...','......dggggd....','....dd.ggd......','...dggdgd.......','....dggbd.......','......dsbd......','.......dbd......','........d.......']

      pixels: ['................','.......dd.......','......dcld......','.....dclhld.....','.....dclhld.....','....dbclhld.....','...dcbclhlad....','..dcbbcllcad....','..dlcbbllcad.dd.','..dclbbccbadcbd.','...dcabccbadcbd.','...dbabccbacbd..','....dabbbaabd...','.....daaaaad....','......ddddd.....','................']
    },
    mushroom: {
      name: '蘑菇', colors: { d:'#66483a', r:'#a95342', t:'#c9694e', s:'#e28a5c', h:'#fff0be', e:'#e6cfa0', b:'#b59872' },
      pixels: ['................','......dddd......','....ddstttdd....','...dshtsthhtrd..','..dshhtttthtrd..','..dttttthhttrd..','.dthtttthhttrrd.','.dthhttttttrrrd.','.drrrtttrrrrrrd.','..dddddddddddd..','......dehed.....','......dehed.....','.....dbeheed....','.....deeeeebd...','......dddddd....','................']
    }
  };
  const itemIds = Object.keys(items);
  const goal = ['herb', 'mushroom', 'gem'];
  const saved = practice.initialDraft;
  const valid = saved && Array.isArray(saved.stack) && Array.isArray(saved.shelf)
    && saved.stack.length + saved.shelf.length === itemIds.length
    && itemIds.every(id => [...saved.stack, ...saved.shelf].includes(id));
  let stack = valid ? [...saved.stack] : ['herb', 'gem'];
  let shelf = valid ? [...saved.shelf] : ['mushroom'];
  const slotsNode = document.getElementById('pack-slots');
  const shelfNode = document.getElementById('pack-shelf');
  const popButton = document.getElementById('pack-pop');
  function sprite(item) {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox','0 0 16 16');
    svg.setAttribute('class','pack-sprite');
    svg.setAttribute('aria-hidden','true');
    svg.setAttribute('shape-rendering','crispEdges');
    const paths = {};
    item.pixels.forEach((line, y) => Array.from(line).forEach((color, x) => {
      if (item.colors[color]) paths[color] = (paths[color] || '') + 'M' + x + ' ' + y + 'h1v1h-1z';
    }));
    for (const [color, path] of Object.entries(paths)) {
      const node = document.createElementNS(ns, 'path');
      node.setAttribute('d', path);
      node.setAttribute('fill', item.colors[color]);
      svg.append(node);
    }
    return svg;
  }
  function renderPack() {
    slotsNode.replaceChildren();
    shelfNode.replaceChildren();
    for (let layer = itemIds.length - 1; layer >= 0; layer--) {
      const item = items[stack[layer]];
      const slot = document.createElement('div');
      slot.className = 'pack-slot';
      if (item) {
        slot.append(sprite(item), document.createTextNode(item.name));
        if (layer === stack.length - 1) {
          slot.classList.add('is-top');
          const label = document.createElement('span');
          label.className = 'pack-tag';
          label.textContent = '栈顶';
          slot.append(label);

      } else {
        slot.classList.add('is-empty');
        slot.textContent = '空位';

      button.type = 'button';

      button.addEventListener('click', () => {

        changed(item.name + '已放到栈顶');
        (shelfNode.querySelector('button') || popButton).focus({preventScroll:true});
      });
      shelfNode.append(button);
    }
    if (!shelf.length) {
      const empty = document.createElement('p');
      empty.className = 'pack-empty';
      empty.textContent = '物架已空';
      shelfNode.append(empty);
    }
    document.getElementById('pack-count').textContent = shelf.length + ' 件';
    popButton.disabled = !stack.length;
  }
  function changed(message) {
    renderPack();
    document.getElementById('pack-live').textContent = message;
    practice.saveDraft({stack:[...stack], shelf:[...shelf]});
  }
  popButton.addEventListener('click', () => {
    if (!stack.length) return;
    const id = stack.pop();
    shelf.push(id);
    changed(items[id].name + '已放回物架');
    if (!stack.length) shelfNode.querySelector('button')?.focus({preventScroll:true});
  });
  practice.onCheck(() => {
    if (goal.every((id, index) => stack[index] === id))
      return practice.correct('背包整理好了！水晶最后入栈，下一次取出的就是水晶。');
    if (stack[0] && stack[0] !== 'herb')
      return practice.incorrect('药草要放在最底层。先取出栈顶物品，腾出底层的位置。');
    if (stack[1] === 'gem')
      return practice.incorrect('水晶在蘑菇应占的那一层。先把上面的物品逐个取回架上，再按目标放入。');
    if (stack.length < goal.length)
      return practice.incorrect('背包还没装齐。按目标从栈底往上看，下一个应放入' + items[goal[stack.length]].name + '。');
    return practice.incorrect('再检查从栈底到栈顶的顺序。只有最上层的物品可以取出。');
  });
  renderPack();
  </script>
  <script>
    'use strict';
    const questions = [
      {id: 'range', title: '点亮小镇路灯', topic: '循环与 range', icon: 'lamp-floor',
       prompt: '天黑了。请调整巡灯程序，只点亮 1、3、5、7 号路灯，让偶数号路灯保持熄灭。',
       hint: '先找第一盏应该亮的灯，再数一数相邻两盏目标灯相差几个编号。range 会跳过终点本身。'},
      {id: 'stack', title: '整理采集背包', topic: '栈与操作顺序', icon: 'backpack',
       prompt: '背包只能从最上层取放物品。请借助旁边的物架，把三件采集品排成指定顺序。',
       hint: '药草已经在底层。想把蘑菇放到水晶下面，可以先把挡住它的物品暂放到架上。'}
    ];
    const get = id => document.getElementById(id);
    const state = new Map(questions.map(q => [q.id, {draft: null, result: null, hintOpen: false}]));
    let current, frame, ready, pending, timer, sequence = 0;

    // Only this function and the selected exercise run inside the opaque-origin frame.
    function runFrame(startExercise) {
      const post = (type, data = {}) => parent.postMessage({channel: 'practice-demo', type, ...data}, '*');
      let started = false, check, request = null;
      function answer(status, detail) {
        if (request === null) return;
        post('result', {request, status, detail: String(detail)});
        request = null;
      }
      window.addEventListener('message', event => {
        const msg = event.data;
        if (event.source !== parent || !msg || msg.channel !== 'practice-demo') return;
        if (msg.type === 'init' && !started) {
          started = true;
          try {
            startExercise(Object.freeze({
              initialDraft: msg.draft,
              onCheck(fn) { check = fn; },
              saveDraft(draft) { post('draft', {draft}); },
              correct(detail) { answer('correct', detail); },
              incorrect(detail) { answer('incorrect', detail); }
            }));
            if (typeof check !== 'function') throw new Error();
            const content = document.getElementById('content');
            new ResizeObserver(() => post('height', {height: Math.ceil(content.getBoundingClientRect().height)})).observe(content);
            post('ready');
          } catch { post('fault'); }
        } else if (msg.type === 'check' && started && typeof check === 'function') {
          request = msg.request;
          try { check(); } catch { post('fault'); }
        }
      });
      post('boot');
    }

    function frameDocument(id) {
      const nonce = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
      const policy = "default-src 'none'; script-src 'nonce-" + nonce + "'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'";
      const bootstrap = '(' + runFrame.toString() + ')(function(practice){\n' + get(id + '-script').textContent + '\n});';
      return '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="' + policy
        + '"><style>' + get('theme').textContent + 'body{background:var(--paper)}#content{display:flow-root}</style></head>'
        + '<body><main id="content">' + get(id + '-content').innerHTML + '</main><script nonce="' + nonce + '">' + bootstrap + '<\/script></body></html>';
    }

    function send(type, data = {}) {
      frame.contentWindow.postMessage({channel: 'practice-demo', type, ...data}, '*');
    }
    function showStatus() {
      const result = state.get(current.id).result;
      get('feedback').hidden = !result;
      if (result) {
        get('feedback').dataset.status = result.status;
        get('outcome').textContent = {correct: '回答正确', incorrect: '再试一次', error: '练习暂时不可用'}[result.status];
        get('detail').textContent = result.detail;
      }
      get('check').disabled = !ready || pending !== null;
      let passed = 0;
      for (const q of questions) {
        const button = get('nav-' + q.id);
        const correct = state.get(q.id).result?.status === 'correct';
        passed += Number(correct);
        button.setAttribute('aria-current', String(q === current));
        button.setAttribute('aria-label', q.title + (correct ? '，已答对' : ''));
        button.querySelector('.nav-check').hidden = !correct;
      }
      get('progress').value = passed;
      get('count').textContent = passed + ' / ' + questions.length;
    }
    function fault() {
      clearTimeout(timer);
      ready = false;
      pending = null;
      state.get(current.id).result = {status: 'error', detail: '题目脚本没有正常响应，请点「重置本题」重新载入。'};
      showStatus();
    }
    function openQuestion(q, focus = false) {
      clearTimeout(timer);
      current = q;
      ready = false;
      pending = null;
      get('title').textContent = q.title;
      get('prompt').textContent = q.prompt;
      get('hint-text').textContent = q.hint;
      get('hints').open = state.get(q.id).hintOpen;
      get('page-index').textContent = String(questions.indexOf(q) + 1).padStart(2,'0') + ' / 02';
      frame = document.createElement('iframe');
      frame.title = q.title + '作答区';
      frame.setAttribute('sandbox', 'allow-scripts');
      frame.referrerPolicy = 'no-referrer';
      frame.srcdoc = frameDocument(q.id);
      get('stage').replaceChildren(frame);
      showStatus();
      timer = setTimeout(fault, 6000);
      if (focus) get('title').focus();
    }
    window.addEventListener('message', event => {
      const msg = event.data;
      if (!frame || event.source !== frame.contentWindow || event.origin !== 'null' || !msg || msg.channel !== 'practice-demo') return;
      const entry = state.get(current.id);
      switch (msg.type) {
        case 'boot': send('init', {draft: entry.draft}); break;
        case 'ready':
          clearTimeout(timer);
          ready = true;
          if (entry.result?.status === 'error') entry.result = null;
          showStatus();
          break;
        case 'height':
          if (Number.isFinite(msg.height)) frame.style.height = Math.min(4096, Math.max(60, msg.height)) + 'px';
          break;
        case 'draft':
          if (ready && msg.draft && typeof msg.draft === 'object') {
            entry.draft = msg.draft;
            entry.result = null;
            showStatus();
          }
          break;
        case 'result':
          if (pending === null || msg.request !== pending || !['correct', 'incorrect'].includes(msg.status) || typeof msg.detail !== 'string') return;
          clearTimeout(timer);
          pending = null;
          entry.result = {status: msg.status, detail: msg.detail.slice(0, 500)};
          showStatus();
          break;
        case 'fault': fault(); break;
      }
    });
    function icon(name, className = '') {
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('class', 'icon ' + className);
      svg.setAttribute('aria-hidden', 'true');
      const use = document.createElementNS(ns, 'use');
      use.setAttribute('href', '#i-' + name);
      svg.append(use);
      return svg;
    }
    for (const q of questions) {
      const li = document.createElement('li');
      const button = document.createElement('button');
      button.id = 'nav-' + q.id;
      button.type = 'button';
      const image = document.createElement('span');
      image.className = 'nav-icon';
      image.append(icon(q.icon));
      const copy = document.createElement('span');
      const title = document.createElement('span');
      title.className = 'nav-title';
      const badge = document.createElement('span');
      badge.className = 'nav-check';
      badge.append(icon('check'));
      title.append(q.title, badge);
      const topic = document.createElement('small');
      topic.textContent = q.topic;
      copy.append(title, topic);
      button.append(image, copy);
      button.onclick = () => { if (current !== q) openQuestion(q, true); };
      li.append(button);
      get('directory').append(li);
    }
    get('check').onclick = () => {
      if (!ready || pending !== null) return;
      pending = ++sequence;
      showStatus();
      timer = setTimeout(fault, 3000);
      send('check', {request: pending});
    };
    get('reset').onclick = () => {
      const entry = state.get(current.id);
      entry.draft = null;
      entry.result = null;
      openQuestion(current, true);
    };
    get('hints').ontoggle = () => { state.get(current.id).hintOpen = get('hints').open; };
    openQuestion(questions[0]);
  </script>
</body>
