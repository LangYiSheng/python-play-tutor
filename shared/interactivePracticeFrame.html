<!doctype html>
<html lang="zh-CN" class="game-workspace">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; form-action 'none'; base-uri 'none'">
  <meta name="referrer" content="no-referrer">
  <style>
    /* SHARED_GAME_PALETTE */
    :root {
      color-scheme: light;
      --forest: var(--game-forest); --deep: var(--game-forest-deep); --paper: var(--game-paper); --surface: var(--game-paper-raised);
      --ink: var(--game-ink); --muted: var(--game-muted); --line: var(--game-line); --gold: var(--game-gold); --wash: #e8edde;
      --mono: "JetBrains Mono", Consolas, monospace;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--ink); background: var(--paper); line-height: 1.55;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { display: flow-root; overflow-wrap: anywhere; }
    img, canvas, svg { max-width: 100%; }
    input, button, select, textarea { font: inherit; color: var(--ink); }
    button, select, input:not([type=checkbox],[type=radio],[type=range]), textarea {
      min-height: 2.125rem; padding: .25rem .65rem; border: 1px solid var(--line);
      border-radius: 8px; background: var(--surface); max-width: 100%;
    }
    button, select { cursor: pointer; color: var(--forest); }
    button:hover:enabled { background: var(--wash); }
    button.primary { background: var(--forest); color: var(--surface); }
    button:disabled { opacity: .6; cursor: default; }
    :focus-visible { outline: 2px solid var(--forest); outline-offset: -2px; }
    code, pre { font-family: var(--mono); }
    @media(pointer:coarse) { button, select { min-height: 44px; } }
    @media(prefers-reduced-motion:reduce) { *, *::before, *::after { scroll-behavior:auto !important; animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  </style>
</head>
<body>
  <main></main>
  <script>
    (() => {
      'use strict';
      const instance = '__PRACTICE_INSTANCE__';
      function initialize(event) {
        if (event.source !== parent || event.data?.instance !== instance || !event.ports[0]) return;
        window.removeEventListener('message', initialize);
        const port = event.ports[0];
        const {source, initialDraft, fontSize} = event.data;
        const root = document.querySelector('main');
        let check, getState, readingState = false, activeRequest = null, draft = initialDraft;
        function fault(message) { port.postMessage({type: 'fault', message: String(message).slice(0, 500)}); }
        function answer(correct, message, value = draft) {
          if (readingState) throw new Error('读取助教状态时不能判题');
          if (activeRequest === null) return;
          port.postMessage({type: 'result', request: activeRequest, correct, message, value});
          activeRequest = null;
        }
        window.practice = Object.freeze({
          initialDraft,
          saveDraft(value) {
            if (readingState) throw new Error('读取助教状态时不能保存草稿');
            // Freeze a snapshot even if the exercise later mutates the original array or object.
            const snapshot = structuredClone(value);
            port.postMessage({type: 'draft', value: snapshot});
            draft = snapshot;
          },
          onCheck(handler) {
            if (typeof handler !== 'function') throw new TypeError('onCheck 需要一个判定函数');
            check = handler;
          },
          onGetState(handler) {
            if (typeof handler !== 'function') throw new TypeError('onGetState 需要一个状态读取函数');
            getState = handler;
          },
          correct(message = '', value) { answer(true, message, value); },
          incorrect(message = '', value) { answer(false, message, value); }
        });
        window.addEventListener('error', e => fault(e.message || '题目脚本运行失败'));
        window.addEventListener('unhandledrejection', e => fault(e.reason?.message || '题目脚本运行失败'));
        window.addEventListener('pagehide', () => fault('题目已离开原页面，请重新加载'));
        port.onmessage = async ({data}) => {
          if (data?.type === 'getState') {
            try {
              if (!getState) throw new Error('题目未注册 practice.onGetState');
              readingState = true;
              const value = getState();
              if (value instanceof Promise) {
                value.catch(() => {});
                throw new Error('onGetState 应同步返回 JSON');
              }
              port.postMessage({type: 'state', request: data.request, value});
            } catch (err) {
              port.postMessage({type: 'state', request: data.request, error: String(err?.message || '读取题目状态失败').slice(0, 500)});
            } finally { readingState = false; }
            return;
          }
          if (data?.type !== 'check' || activeRequest !== null) return;
          activeRequest = data.request;
          try {
            await check();
            if (activeRequest !== null) fault('判定函数没有调用 practice.correct 或 practice.incorrect');
          } catch (err) { fault(err?.message || '题目判定失败'); }
        };
        try {
          document.documentElement.style.fontSize = fontSize;
          const style = document.createElement('style');
          style.textContent = source.css;
          document.head.append(style);
          root.innerHTML = source.html;
          const script = document.createElement('script');
          script.textContent = '(function(practice){\n"use strict";\n' + source.js + '\n})(window.practice);';
          document.body.append(script);
          if (!check) throw new Error('请在 JavaScript 中使用 practice.onCheck 注册提交判定');
          new ResizeObserver(() => port.postMessage({type: 'height', height: Math.ceil(root.getBoundingClientRect().height)})).observe(root);
          port.postMessage({type: 'ready'});
        } catch (err) { fault(err?.message || '题目初始化失败'); }
      }
      window.addEventListener('message', initialize);
      parent.postMessage({type: 'interactive-practice-boot', instance}, '*');
    })();
  </script>
</body>
</html>
